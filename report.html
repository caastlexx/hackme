
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackMe | Feedback Report</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./index.html" aria-label="HackMe sign up">
          <span class="brand-mark" aria-hidden="true"><span class="brand-dot"></span></span>
          HackMe
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="./index.html">Sign up</a>
          <a href="./report.html" aria-current="page">Feedback Report</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="report-hero" aria-labelledby="report-title">
        <div class="container content-narrow">
          <div class="report-heading-row">
            <div>
              <p class="eyebrow">Debrief</p>
              <h1 id="report-title">Feedback Report</h1>
            </div>
          </div>
        </div>
      </section>

      <section class="section report-summary-section">
        <div class="container content-narrow">
          <div class="empty-report">
            <div class="empty-report-icon" aria-hidden="true">○</div>
            <h2>No report available</h2>
            <p>Complete a simulation to generate a report.</p>
            <div class="hero-actions"><a class="button button-primary" href="./index.html">Go to sign up</a></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
